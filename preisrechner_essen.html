<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7a1220">
  <title>Nikolausmarkt 2026 &ndash; Preisrechner Essen</title>
  <style>
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #f3f4ef;
      color: #172e27;
      font-family: system-ui, sans-serif;
      font-variant-numeric: tabular-nums;
    }
    .banner {
      flex: none;
      background: #7a1220;
      color: #fff;
      padding: clamp(6px, 1.4vh, 14px) 12px;
      text-align: center;
      border-bottom: 5px solid #5a0c17;
    }
    .banner-title {
      display: block;
      font-size: clamp(1.15rem, min(6.5vw, 3.4vh), 2.4rem);
      font-weight: 800;
      letter-spacing: .02em;
      line-height: 1.15;
    }
    .banner-subtitle {
      display: block;
      margin-top: 2px;
      font-size: clamp(.95rem, min(5.2vw, 2.7vh), 1.9rem);
      font-weight: 600;
      letter-spacing: .01em;
      line-height: 1.2;
      color: #f6dfe2;
    }
    main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      width: min(100%, 720px);
      margin: 0 auto;
      padding: clamp(8px, 1.8vh, 22px) clamp(8px, 2.5vw, 16px) clamp(10px, 2vh, 22px);
    }
    .title-row { display: flex; align-items: center; gap: 12px; margin-bottom: clamp(4px, 1vh, 10px); }
    h1 { margin: 0; font-size: clamp(1.05rem, min(5.5vw, 3vh), 1.9rem); }
    .hint { margin: 0 0 clamp(8px, 1.8vh, 24px); color: #4b6057; font-size: clamp(.75rem, min(3.6vw, 2vh), 1rem); line-height: 1.4; }
    .back {
      margin-left: auto;
      flex: none;
      min-height: 0;
      padding: clamp(6px, 1vh, 10px) clamp(10px, 2.5vw, 16px);
      border: 1px solid #cdd6ce;
      border-radius: 10px;
      background: #e6e8e4;
      color: #3b4a43;
      font-size: clamp(.75rem, min(3.4vw, 1.8vh), 1rem);
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .back:focus-visible { outline: 3px solid #aa5700; outline-offset: 3px; }
    .head, .item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, .95fr) minmax(0, 1fr) minmax(0, .9fr);
      align-items: center;
      gap: clamp(4px, 1.4vw, 10px);
      text-align: center;
    }
    .head { flex: none; margin-bottom: clamp(3px, .8vh, 8px); color: #4b6057; font-size: clamp(.62rem, min(3vw, 1.6vh), .85rem); }
    .head span:first-child { grid-column: 2; }
    .head span:last-child { grid-column: 4; }
    .list {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-auto-rows: minmax(clamp(60px, 9vh, 150px), 1fr);
      gap: clamp(6px, 1.6vh, 20px);
    }
    .item { height: 100%; }
    button {
      height: 100%;
      min-height: clamp(48px, 8vh, 150px);
      border: 0;
      border-radius: clamp(10px, 1.8vw, 20px);
      font: inherit;
      font-size: clamp(1.5rem, min(9vw, 6.5vh), 4.5rem);
      font-weight: 650;
      line-height: 1;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .minus { background: #e0e7e1; color: #174b3d; }
    .plus { background: #174b3d; color: #fff; }
    button:active:not(:disabled) { transform: scale(.96); }
    button:focus-visible { outline: 3px solid #aa5700; outline-offset: 3px; }
    button:disabled { opacity: .35; cursor: default; }
    .name { font-size: clamp(.9rem, min(4.4vw, 2.6vh), 1.7rem); font-weight: 700; line-height: 1.15; }
    .price, .detail { display: block; margin-top: 4px; font-size: clamp(.62rem, min(3vw, 1.7vh), .95rem); font-weight: 400; color: #4b6057; line-height: 1.3; }
    .quantity {
      min-width: 0;
      border-left: 1px solid #cdd6ce;
      padding-left: clamp(4px, 1.2vw, 10px);
      overflow-wrap: anywhere;
    }
    .count { display: block; font-size: clamp(1.25rem, min(6vw, 3.6vh), 2.6rem); font-weight: 700; line-height: 1.1; }
    .subtotal { display: block; font-size: clamp(.68rem, min(3.2vw, 1.8vh), 1.05rem); color: #4b6057; }
    footer {
      flex: none;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: clamp(10px, 3vw, 24px);
      border-top: 2px solid #cdd6ce;
      margin-top: clamp(10px, 2vh, 28px);
      padding-top: clamp(10px, 2vh, 24px);
    }
    #reset {
      height: auto;
      min-height: clamp(48px, 8vh, 96px);
      padding: clamp(8px, 1.5vh, 14px) clamp(20px, 8vw, 52px);
      background: #f7dcdd;
      color: #7a1220;
      font-size: clamp(.9rem, min(4vw, 2.2vh), 1.3rem);
    }
    .total { margin-left: auto; text-align: right; }
    .total label { display: block; font-size: clamp(.8rem, min(3.4vw, 2vh), 1.1rem); }
    #total { display: block; font-size: clamp(1.6rem, min(8vw, 5vh), 3.2rem); font-weight: 750; line-height: 1.1; }
  </style>
</head>
<body>
  <header class="banner">
    <span class="banner-title">Nikolausmarkt 2026</span>
    <span class="banner-subtitle">F&ouml;rderverein Kita St. Joseph</span>
  </header>
  <main>
    <div class="title-row">
      <h1>Preisrechner Essen</h1>
      <a class="back" href="./index.html" aria-label="Zur&uuml;ck zur Auswahl">&larr; Back</a>
    </div>
    <p class="hint">Essenspreise ohne Pfand.</p>

    <div class="head" aria-hidden="true"><span>Einzelpreis</span><span>Anzahl / Summe</span></div>
    <section class="list" aria-label="Essen">
      <div class="item">
        <button type="button" class="minus" data-item="currywurst" data-change="-1"
                aria-label="Currywurst weniger" disabled>&minus;</button>
        <div class="name">Curry-<br>Wurst<span class="price">6,00 &euro;</span></div>
        <button type="button" class="plus" data-item="currywurst" data-change="1"
                aria-label="Currywurst mehr">+</button>
        <div class="quantity">
          <output class="count" id="currywurst-count" aria-label="Anzahl Currywurst">0</output>
          <output class="subtotal" id="currywurst-subtotal" aria-label="Summe Currywurst">0,00 &euro;</output>
        </div>
      </div>
      <div class="item">
        <button type="button" class="minus" data-item="bratwurst" data-change="-1"
                aria-label="Bratwurst weniger" disabled>&minus;</button>
        <div class="name">Brat-<br>Wurst<span class="price">5,00 &euro;</span></div>
        <button type="button" class="plus" data-item="bratwurst" data-change="1"
                aria-label="Bratwurst mehr">+</button>
        <div class="quantity">
          <output class="count" id="bratwurst-count" aria-label="Anzahl Bratwurst">0</output>
          <output class="subtotal" id="bratwurst-subtotal" aria-label="Summe Bratwurst">0,00 &euro;</output>
        </div>
      </div>
    </section>

    <footer>
      <button type="button" id="reset">Reset</button>
      <div class="total">
        <label for="total">Gesamt</label>
        <output id="total" aria-live="polite" aria-atomic="true">0,00 &euro;</output>
      </div>
    </footer>
    <noscript>Bitte JavaScript aktivieren, um den Preisrechner zu verwenden.</noscript>
  </main>
  <script>
    "use strict";

    const items = {
      currywurst: { count: 0, cents: 600 },
      bratwurst: { count: 0, cents: 500 }
    };
    const currency = new Intl.NumberFormat("de-DE", { style: "currency", currency: "EUR" });
    const controls = document.querySelectorAll("[data-item]");

    function render() {
      let totalCents = 0;
      for (const [name, item] of Object.entries(items)) {
        const subtotalCents = item.count * item.cents;
        document.getElementById(`${name}-count`).textContent = item.count;
        document.getElementById(`${name}-subtotal`).textContent = currency.format(subtotalCents / 100);
        totalCents += subtotalCents;
      }
      for (const button of controls) {
        button.disabled = button.dataset.change === "-1" && items[button.dataset.item].count === 0;
      }
      document.getElementById("total").textContent = currency.format(totalCents / 100);
    }

    for (const button of controls) {
      button.addEventListener("click", () => {
        const item = items[button.dataset.item];
        item.count = Math.max(0, item.count + Number(button.dataset.change));
        render();
      });
    }

    document.getElementById("reset").addEventListener("click", () => {
      for (const item of Object.values(items)) {
        item.count = 0;
      }
      render();
    });

    render();
  </script>
</body>
</html>
