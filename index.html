<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7a1220">
  <title>Nikolausmarkt 2026 &ndash; Preisrechner</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f3f4ef;
      color: #172e27;
      font-family: system-ui, sans-serif;
      font-variant-numeric: tabular-nums;
    }
    .banner {
      background: #7a1220;
      color: #fff;
      padding: 12px 12px;
      text-align: center;
      border-bottom: 5px solid #5a0c17;
    }
    .banner-title {
      display: block;
      font-size: clamp(1.7rem, 7vw, 2.4rem);
      font-weight: 800;
      letter-spacing: .02em;
      line-height: 1.15;
    }
    .banner-subtitle {
      display: block;
      margin-top: 2px;
      font-size: clamp(1.35rem, 5.6vw, 1.9rem);
      font-weight: 600;
      letter-spacing: .01em;
      line-height: 1.2;
      color: #f6dfe2;
    }
    main { width: min(100%, 440px); margin: 0 auto; padding: 24px 12px; }
    h1 { margin: 0 0 8px; font-size: 1.8rem; }
    .hint { margin: 0 0 28px; color: #4b6057; line-height: 1.5; }
    .choices { display: grid; gap: 20px; }
    .choice {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      min-height: 150px;
      padding: 20px;
      border-radius: 14px;
      background: #174b3d;
      color: #fff;
      font-size: 2rem;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .choice.food { background: #7a1220; }
    .choice:active { transform: scale(.98); }
    .choice:focus-visible { outline: 3px solid #aa5700; outline-offset: 3px; }
    .choice span { font-size: .9rem; font-weight: 400; opacity: .9; }
  </style>
</head>
<body>
  <header class="banner">
    <span class="banner-title">Nikolausmarkt 2026</span>
    <span class="banner-subtitle">F&ouml;rderverein Kita St. Joseph</span>
  </header>
  <main>
    <h1>Preisrechner</h1>
    <p class="hint">Bitte Bereich w&auml;hlen.</p>
    <nav class="choices">
      <a class="choice" href="./preisrechner_getraenke.html">
        Getr&auml;nke
        <span>Wein, KiPu und Pfand</span>
      </a>
      <a class="choice food" href="./preisrechner_essen.html">
        Essen
        <span>Currywurst und Bratwurst</span>
      </a>
    </nav>
  </main>
</body>
</html>
