<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7a1220">
  <title>Nikolausmarkt 2026 &ndash; Preisrechner</title>
  <style>
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #f3f4ef;
      color: #172e27;
      font-family: system-ui, sans-serif;
      font-variant-numeric: tabular-nums;
    }
    .banner {
      flex: none;
      background: #7a1220;
      color: #fff;
      padding: clamp(6px, 1.4vh, 14px) 12px;
      text-align: center;
      border-bottom: 5px solid #5a0c17;
    }
    .banner-title {
      display: block;
      font-size: clamp(1.15rem, min(6.5vw, 3.4vh), 2.4rem);
      font-weight: 800;
      letter-spacing: .02em;
      line-height: 1.15;
    }
    .banner-subtitle {
      display: block;
      margin-top: 2px;
      font-size: clamp(.95rem, min(5.2vw, 2.7vh), 1.9rem);
      font-weight: 600;
      letter-spacing: .01em;
      line-height: 1.2;
      color: #f6dfe2;
    }
    main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      width: min(100%, 720px);
      margin: 0 auto;
      padding: clamp(8px, 1.8vh, 22px) clamp(8px, 2.5vw, 16px) clamp(10px, 2vh, 22px);
    }
    h1 { margin: 0 0 clamp(2px, .6vh, 8px); font-size: clamp(1.05rem, min(5.5vw, 3vh), 1.9rem); }
    .hint { margin: 0 0 clamp(8px, 1.8vh, 24px); color: #4b6057; font-size: clamp(.75rem, min(3.6vw, 2vh), 1rem); line-height: 1.4; }
    .choices {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-auto-rows: minmax(clamp(90px, 14vh, 240px), 1fr);
      gap: clamp(8px, 2vh, 24px);
    }
    .choice {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(2px, .8vh, 8px);
      padding: clamp(10px, 2.5vh, 24px) clamp(10px, 3vw, 24px);
      border-radius: clamp(10px, 1.8vw, 20px);
      background: #174b3d;
      color: #fff;
      font-size: clamp(1.3rem, min(8vw, 4.5vh), 3rem);
      font-weight: 700;
      line-height: 1.1;
      text-align: center;
      text-decoration: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .choice.food { background: #7a1220; }
    .choice:active { transform: scale(.98); }
    .choice:focus-visible { outline: 3px solid #aa5700; outline-offset: 3px; }
    .choice span { font-size: clamp(.7rem, min(3.4vw, 1.9vh), 1.1rem); font-weight: 400; line-height: 1.3; opacity: .9; }
  </style>
</head>
<body>
  <header class="banner">
    <span class="banner-title">Nikolausmarkt 2026</span>
    <span class="banner-subtitle">F&ouml;rderverein Kita St. Joseph</span>
  </header>
  <main>
    <h1>Preisrechner</h1>
    <p class="hint">Bitte Bereich w&auml;hlen.</p>
    <nav class="choices">
      <a class="choice" href="./preisrechner_getraenke.html">
        Getr&auml;nke
        <span>Wein, KiPu und Pfand</span>
      </a>
      <a class="choice food" href="./preisrechner_essen.html">
        Essen
        <span>Currywurst und Bratwurst</span>
      </a>
    </nav>
  </main>
</body>
</html>
